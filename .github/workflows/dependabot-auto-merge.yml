name: Dependabot auto-merge

on: pull_request

# One Dependabot merge at a time so we don't hit "Base branch was modified".
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Prefer a PAT with the workflow scope so PRs that edit
          # .github/workflows can enable auto-merge. GITHUB_TOKEN alone
          # is refused for those merges.
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi
            echo "Attempt ${attempt} failed; updating branch and retrying..."
            gh pr update-branch "$PR_URL" || true
            sleep 15
          done
          echo "Failed to enable auto-merge after retries" >&2
          exit 1
